<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Do You Love Rabia?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ffe6f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 50px;
      color: #ff3366;
      padding: 0 20px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.5em;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      position: relative;
      touch-action: manipulation; /* iOS friendly */
    }

    #yes {
      background-color: #ff6699;
      color: white;
    }

    #no {
      background-color: #999;
      color: white;
      position: absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <h1>Do You Love Rabia?</h1>
  <button id="yes" class="btn">Yes ❤️</button>
  <button id="no" class="btn">No 😢</button>

  <script>
    const noBtn = document.getElementById('no');

    // Function to move the "No" button to a random position
    function moveNoButton() {
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const maxX = window.innerWidth - btnWidth - 20; // 20px padding from edges
      const maxY = window.innerHeight - btnHeight - 20;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // Use both mouseover and touchstart for iPhone Safari
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton);

    // Yes button click
    document.getElementById('yes').addEventListener('click', () => {
      alert('I knew it! ❤️');
    });
  </script>
</body>
</html>
