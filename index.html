<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jasmine 💖 Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- WhatsApp preview -->
<meta property="og:title" content="Jasmine 💖 Will You Be My Valentine?" />
<meta property="og:description" content="Try to press No… if you dare 😏💘" />
<meta property="og:image" content="https://i.imgur.com/1X6RKkF.png" />
<meta property="og:type" content="website" />

<style>
body {
  margin:0; height:100vh; background:linear-gradient(135deg,#ff758c,#ff7eb3);
  font-family:'Comic Sans MS',Arial,sans-serif; overflow:hidden; color:white;
}
.container {
  height:100vh; text-align:center; padding:80px 20px; position:relative;
}
h1 { font-size:2.4rem; margin-bottom:60px; }
button {
  font-size:1.3rem; padding:18px 40px; border-radius:50px; border:none;
  cursor:pointer; position:absolute; transition:transform .2s;
}
#yes { background:#ff0033; color:white; left:50%; transform:translateX(-120%); }
#no { background:white; color:#ff0033; border:2px solid #ff0033; left:50%; transform:translateX(20%); }

.heart { position:absolute; bottom:-20px; animation:floatUp linear infinite; opacity:.8; }
@keyframes floatUp { from{transform:translateY(0);opacity:1} to{transform:translateY(-110vh);opacity:0} }

.ring { font-size:120px; animation:ringPop 1.2s ease-out forwards; }
@keyframes ringPop { 0%{transform:scale(0) rotate(-30deg);opacity:0} 60%{transform:scale(1.2) rotate(10deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }

.sparkle { position:absolute; font-size:24px; animation:sparkle 1.5s ease-out forwards; }
@keyframes sparkle { from{transform:translateY(0) scale(1);opacity:1} to{transform:translateY(-80px) scale(0);opacity:0} }

.final {
  min-height:100vh; background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:30px;
}
.final img { width:220px; margin:20px 0; }
.final h2 { font-size:2.3rem; }
.final p { font-size:1.2rem; max-width:360px; }
.names { margin-top:25px; font-size:1.6rem; font-weight:bold; }
</style>
</head>

<body>
<div class="container" id="container">
  <h1>Jasmine 💖<br>Will you be my Valentine?</h1>
  <button id="yes">Yes 💖</button>
  <button id="no">No 💔</button>
</div>

<!-- Music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2023/02/28/audio_8aab8bcbda.mp3?filename=love-romantic-143298.mp3" type="audio/mpeg">
</audio>

<!-- Kiss sound -->
<audio id="kiss">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0c8b02b2c8.mp3?filename=kiss-140019.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn=document.getElementById("no"), yesBtn=document.getElementById("yes");
const music=document.getElementById("music"), kiss=document.getElementById("kiss");
let scale=1;

function moveNo(){
  const x=Math.random()*(window.innerWidth-noBtn.offsetWidth);
  const y=Math.random()*(window.innerHeight-noBtn.offsetHeight);
  noBtn.style.left=x+"px"; noBtn.style.top=y+"px";
  scale*=.88; noBtn.style.transform=`scale(${scale})`;
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("touchstart",e=>{ e.preventDefault(); moveNo(); });

yesBtn.addEventListener("click",()=>{
  music.play(); kiss.play();
  // Show ring first
  document.body.innerHTML=`<div class="final"><div class="ring">💍</div></div>`;
  for(let i=0;i<12;i++){
    const s=document.createElement("div");
    s.className="sparkle"; s.innerHTML="✨";
    s.style.left=Math.random()*100+"vw"; s.style.top=Math.random()*60+"vh";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
  // Show final message
  setTimeout(()=>{document.body.innerHTML=`
    <div class="final">
      <h2>YAYYYY 💖</h2>
      <img src="https://media.tenor.com/0AVbKGY_MxMAAAAi/teddy-bear-love.gif" />
      <p>Jasmine, you make my days brighter, my heart softer, and my life so much sweeter 🥰<br><br>
      I’m so lucky to call you mine.<br>Happy Valentine’s Day 💘</p>
      <div class="names">Jasmine ❤️ Ramael</div>
    </div>`},1600);
});

document.body.addEventListener("click",()=>{music.play();},{once:true});

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart"; heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*20+15)+"px";
  heart.style.animationDuration=(Math.random()*3+4)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),7000);
}
setInterval(createHeart,300);
</script>
</body>
</html>
